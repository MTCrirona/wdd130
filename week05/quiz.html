<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML and CSS quiz form with four questions.">
    <meta name="author" content="Crirona Chauke">
    <title>HTML and CSS Quiz | WDD 130</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <div class="form-item">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2">2. Explain the difference between HTML and CSS.</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which CSS property changes the text color?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="background-color">background-color</option>
                    <option value="color">color</option>
                    <option value="font-size">font-size</option>
                    <option value="text-align">text-align</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. How many heading levels are available in HTML?</label>
                <input type="number" id="q4" name="q4" min="1" step="1" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Crirona Chauke | WDD 130</p>
    </footer>
</body>

</html>
