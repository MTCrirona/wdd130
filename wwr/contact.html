<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting for reservations, rafting adventures, questions, and customer support.">
    <meta name="author" content="Crirona Chauke">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo" width="120">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Information -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>Phone: <a href="tel:+19999999999">
                    +1 999 999 9999
                </a></p>
            <p>Email:
                <a href="mailto:info@whitewater.com">
                    info@whitewater.com
                </a>
            </p>
        </section>

        <!-- Map and Contact Form -->
        <section class="contact-container">

            <div class="map">
                <h2>Find Our Location</h2>

                <iframe src="https://www.google.com/maps?q=California&amp;output=embed" title="White Water Rafting Location Map" loading="lazy" allowfullscreen>
                </iframe>
            </div>

            <div class="contact-form">
                <h2>Send Us a Message</h2>

                <form>
                    <div class="form-item">
                        <label for="fullname">
                            Full Name:
                        </label>

                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-item">
                        <label for="email">
                            Email Address:
                        </label>

                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>


                    <div class="form-item">
                        <label for="message">
                            Your Message:
                        </label>

                        <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                    </div>

                    <label class="newsletter">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">
                        Get in Touch!
                    </button>
                </form>
            </div>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Company Manager" width="200" height="200">
                    <figcaption>
                        Company Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Senior Rafting Guide" width="200" height="200">
                    <figcaption>
                        Senior Rafting Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Customer Service Representative" width="200" height="200">
                    <figcaption>
                        Customer Service Representative
                    </figcaption>
                </figure>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 | White Water Rafting |
            Crirona Chauke
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook" width="30">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn" width="30">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram" width="30">
            </a>
        </nav>

    </footer>
</body>

</html>
